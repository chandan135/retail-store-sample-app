      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: service
      app.kubernetes.io/owner: retail-store-sample 
    ports:
    - name: http
      port: 8080  # service port
      targetPort: 8080 # container port
      protocol: TCP